<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Socket.IO Chat</title>
		<style>
			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				font-family: Arial, sans-serif;
				background: #f0f2f5;
				height: 100vh;
			}

			.app {
				display: grid;
				grid-template-columns: 260px 1fr;
				height: 100vh;
				max-width: 1200px;
				margin: 0 auto;
				background: #fff;
				border-left: 1px solid #e5e7eb;
				border-right: 1px solid #e5e7eb;
			}

			.sidebar {
				border-right: 1px solid #e5e7eb;
				padding: 14px;
				overflow-y: auto;
			}

			.sidebar h3 {
				margin: 0 0 12px;
				font-size: 16px;
			}

			#userList {
				list-style: none;
				margin: 0;
				padding: 0;
			}

			#userList li {
				padding: 10px 12px;
				margin-bottom: 8px;
				border-radius: 10px;
				background: #f3f4f6;
				cursor: pointer;
			}

			#userList li.active {
				background: #dbeafe;
			}

			.main {
				display: grid;
				grid-template-rows: auto 1fr auto;
			}

			.header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 12px 16px;
				border-bottom: 1px solid #e5e7eb;
			}

			.header .title {
				font-weight: 600;
			}

			.controls {
				display: flex;
				gap: 8px;
			}

			select,
			input,
			button {
				padding: 10px 12px;
				border: 1px solid #d1d5db;
				border-radius: 10px;
				font-size: 14px;
			}

			button {
				background: #2563eb;
				color: #fff;
				border: none;
				cursor: pointer;
			}

			button:hover {
				background: #1d4ed8;
			}

			#messages {
				padding: 16px;
				overflow-y: auto;
				display: flex;
				flex-direction: column;
				gap: 10px;
				background: #f7f8fa;
			}

			.msg {
				display: flex;
				flex-direction: column;
				max-width: 72%;
				padding: 10px 12px;
				border-radius: 16px;
				word-break: break-word;
				font-size: 14px;
			}

			.msg .meta {
				font-size: 11px;
				opacity: 0.7;
				margin-bottom: 4px;
			}

			.msg.mine {
				align-self: flex-end;
				background: #1d4ed8;
				color: #fff;
				border-bottom-right-radius: 6px;
			}

			.msg.other {
				align-self: flex-start;
				background: #e5e7eb;
				color: #111827;
				border-bottom-left-radius: 6px;
			}

			.msg.system {
				align-self: center;
				background: #eef2ff;
				color: #4338ca;
				max-width: 90%;
				text-align: center;
			}

			.composer {
				display: flex;
				gap: 8px;
				padding: 12px;
				border-top: 1px solid #e5e7eb;
				background: #fff;
			}

			#messageInput {
				flex: 1;
			}

			#recipientInput {
				width: 220px;
			}

			.join-overlay {
				position: fixed;
				inset: 0;
				background: rgba(17, 24, 39, 0.45);
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.join-card {
				width: min(420px, 92vw);
				background: #fff;
				padding: 20px;
				border-radius: 14px;
			}

			.join-card h2 {
				margin: 0 0 12px;
			}

			.join-card form {
				display: flex;
				gap: 8px;
			}

			.hidden {
				display: none;
			}
		</style>
	</head>
	<body>
		<div id="joinOverlay" class="join-overlay">
			<div class="join-card">
				<h2>Enter a username to join the chat</h2>
				<form id="joinForm">
					<input id="usernameInput" placeholder="e.g. trungnguyen" autocomplete="off" />
					<button type="submit">Join chat</button>
				</form>
			</div>
		</div>

		<div class="app hidden" id="app">
			<aside class="sidebar">
				<h3>Online users</h3>
				<ul id="userList"></ul>
			</aside>

			<section class="main">
				<div class="header">
					<div class="title">Messenger style chat</div>
					<div id="meLabel">Me: ...</div>
				</div>

				<div id="messages"></div>

				<form id="chatForm" class="composer" autocomplete="off">
					<select id="modeSelect">
						<option value="group">Group</option>
						<option value="private">1:1</option>
					</select>
					<input id="recipientInput" placeholder="To username (for 1:1)" />
					<input id="messageInput" placeholder="Type a message..." />
					<button type="submit">Send</button>
				</form>
			</section>
		</div>

		<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
		<script>
			const socket = io("http://localhost:3000");
			let myUsername = "";
			let audioCtx;

			const joinOverlay = document.getElementById("joinOverlay");
			const app = document.getElementById("app");
			const joinForm = document.getElementById("joinForm");
			const usernameInput = document.getElementById("usernameInput");
			const meLabel = document.getElementById("meLabel");
			const userList = document.getElementById("userList");
			const modeSelect = document.getElementById("modeSelect");
			const recipientInput = document.getElementById("recipientInput");
			const messageInput = document.getElementById("messageInput");
			const chatForm = document.getElementById("chatForm");
			const messages = document.getElementById("messages");

			const initAudio = async () => {
				if (!audioCtx) {
					audioCtx = new AudioContext();
				}
				if (audioCtx.state === "suspended") {
					await audioCtx.resume();
				}
			};

			const playNotification = () => {
				if (!audioCtx || audioCtx.state !== "running") return;
				const oscillator = audioCtx.createOscillator();
				const gain = audioCtx.createGain();

				oscillator.type = "sine";
				oscillator.frequency.value = 880;
				gain.gain.value = 0.04;

				oscillator.connect(gain);
				gain.connect(audioCtx.destination);

				oscillator.start();
				oscillator.stop(audioCtx.currentTime + 0.08);
			};

			const appendMsg = (payload) => {
				const wrapper = document.createElement("div");
				const meta = document.createElement("div");
				const text = document.createElement("div");

				wrapper.className = "msg";

				if (payload.type === "system") {
					wrapper.classList.add("system");
					text.textContent = payload.text;
				} else {
					const isMine = payload.from === myUsername;
					wrapper.classList.add(isMine ? "mine" : "other");

					const scope = payload.type === "private" ? `PRIVATE to ${payload.to}` : "GROUP";
					meta.className = "meta";
					meta.textContent = `${payload.from} • ${scope}`;
					wrapper.appendChild(meta);

					text.textContent = payload.text;

					if (!isMine) {
						playNotification();
					}
				}

				wrapper.appendChild(text);
				messages.appendChild(wrapper);
				messages.scrollTop = messages.scrollHeight;
			};

			const renderUsers = (users) => {
				userList.innerHTML = "";

				users.forEach((username) => {
					const li = document.createElement("li");
					li.textContent = username;

					if (recipientInput.value === username) {
						li.classList.add("active");
					}

					li.addEventListener("click", () => {
						if (username === myUsername) return;
						modeSelect.value = "private";
						recipientInput.value = username;
						renderUsers(users);
					});

					userList.appendChild(li);
				});
			};

			joinForm.addEventListener("submit", async (e) => {
				e.preventDefault();
				const username = usernameInput.value.trim();
				if (!username) return;

				await initAudio();
				socket.emit("join", { username });
			});

			chatForm.addEventListener("submit", (e) => {
				e.preventDefault();
				const text = messageInput.value.trim();
				if (!text) return;

				if (modeSelect.value === "group") {
					socket.emit("chat:group", { text });
				} else {
					const to = recipientInput.value.trim();
					if (!to) {
						alert("Enter the recipient username for 1:1 mode");
						return;
					}

					socket.emit("chat:private", { to, text });
				}

				messageInput.value = "";
				messageInput.focus();
			});

			socket.on("join:ok", ({ username }) => {
				myUsername = username;
				meLabel.textContent = `Me: ${username}`;
				joinOverlay.classList.add("hidden");
				app.classList.remove("hidden");
				messageInput.focus();
			});

			socket.on("join:error", (message) => {
				alert(message);
			});

			socket.on("user:list", (users) => {
				renderUsers(users);
			});

			socket.on("chat:receive", (payload) => {
				appendMsg(payload);
			});
		</script>
	</body>
</html>
