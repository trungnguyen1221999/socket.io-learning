<!doctype html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Socket.IO Chat Test</title>
		<style>
			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				font-family: Arial, sans-serif;
				background: #f6f7fb;
			}

			.chat {
				max-width: 720px;
				margin: 24px auto;
				background: #fff;
				border: 1px solid #ddd;
				border-radius: 8px;
				overflow: hidden;
			}

			.header {
				padding: 12px 16px;
				border-bottom: 1px solid #eee;
				font-weight: 600;
			}

			#messages {
				list-style: none;
				margin: 0;
				padding: 12px 16px;
				height: 360px;
				overflow-y: auto;
			}

			#messages li {
				padding: 8px 10px;
				margin-bottom: 8px;
				background: #f1f5ff;
				border-radius: 6px;
			}

			form {
				display: grid;
				gap: 10px;
				padding: 12px;
				border-top: 1px solid #eee;
			}

			.row {
				display: flex;
				gap: 8px;
			}

			#input {
				flex: 1;
				padding: 10px 12px;
				border: 1px solid #ccc;
				border-radius: 6px;
				outline: none;
			}

			#targetId {
				flex: 1;
				padding: 10px 12px;
				border: 1px solid #ccc;
				border-radius: 6px;
				outline: none;
			}

			button {
				padding: 10px 14px;
				border: none;
				border-radius: 6px;
				background: #2563eb;
				color: #fff;
				cursor: pointer;
			}

			button:hover {
				background: #1d4ed8;
			}

			#myId {
				padding: 0 16px 10px;
				font-size: 14px;
				color: #555;
			}
		</style>
	</head>
	<body>
		<div class="chat">
			<div class="header">Chat test Socket.IO</div>
			<div id="myId">My socket id: (connecting...)</div>

			<ul id="messages"></ul>

			<form id="form" autocomplete="off">
				<div class="row">
					<input id="input" placeholder="Enter message..." />
				</div>
				<div class="row">
					<button type="button" id="btnAll">Send all</button>
					<button type="button" id="btnOthers">Send all except me</button>
				</div>
				<div class="row">
					<input id="targetId" placeholder="Target socket id..." />
					<button type="button" id="btnToId">Send to ID</button>
				</div>
			</form>
		</div>

		<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
		<script>
			const SOCKET_URL = "http://localhost:3000";
			const socketKey = "chat message";
			const socket = io(SOCKET_URL);
			const form = document.getElementById("form");
			const input = document.getElementById("input");
			const targetId = document.getElementById("targetId");
			const btnAll = document.getElementById("btnAll");
			const btnOthers = document.getElementById("btnOthers");
			const btnToId = document.getElementById("btnToId");
			const myId = document.getElementById("myId");
			const messages = document.getElementById("messages");

			const appendMsg = (msg) => {
				const item = document.createElement("li");
				item.textContent = msg;
				messages.appendChild(item);
				messages.scrollTop = messages.scrollHeight;
			};

			const getText = () => input.value.trim();

			form.addEventListener("submit", (e) => {
				e.preventDefault();
			});

			btnAll.addEventListener("click", () => {
				const text = getText();
				if (!text) return;
				socket.emit("send all", text);
				input.value = "";
			});

			btnOthers.addEventListener("click", () => {
				const text = getText();
				if (!text) return;
				socket.emit("send others", text);
				input.value = "";
			});

			btnToId.addEventListener("click", () => {
				const text = getText();
				const id = targetId.value.trim();
				if (!text || !id) return;
				socket.emit("send to id", { targetId: id, message: text });
				input.value = "";
			});

			socket.on("self id", (id) => {
				myId.textContent = `My socket id: ${id}`;
			});

			socket.on(socketKey, (msg) => {
				appendMsg(msg);
			});
		</script>
	</body>
</html>
